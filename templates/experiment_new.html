{% extends "experiment_base.html" %}{% block title %}New Experiment | Experiment Memory{% endblock %}{% block content %}<header class="page-title"><p class="eyebrow">NEW MEMORY</p><h1>Record an experiment</h1><p>Capture the evidence now so a future decision can learn from it.</p></header><form class="panel form" id="experiment-form"><label>Experiment Name<input name="name" required placeholder="e.g. Shorter onboarding checklist"></label><label>Objective<textarea name="objective" required placeholder="What were you trying to learn?"></textarea></label><label>What did you change or test?<textarea name="change" required placeholder="Describe the product or experience change."></textarea></label><label>Result<select name="result" required><option value="">Select a result</option><option>Successful</option><option>Unsuccessful</option><option>Inconclusive</option></select></label><label>Learning<textarea name="learning" required placeholder="What did the team discover?"></textarea></label><p class="form-error" hidden></p><button class="primary" type="submit">Save Experiment <span>→</span></button></form>{% endblock %}
